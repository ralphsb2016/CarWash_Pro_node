<html>
    <head>
        <title>Pantalla de login</title>

        <style>

         body {

         background-color: #f5f7fa;
         display: flex;
         justify-content: center;
         align-items: center;
         height: 100vh;
         margin: 0;
         font-family: arial, sans-serif;

         }

         .login-box {

         background-color: white;
         width: 340px;
         padding: 40px 30px;
         border-radius: 12px;
         box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
         text-align: center;

         }

         .logo{

          background-color: #1a2a3a;
          color: white;
          font-size: 24px;
          font-weight: bold;
          padding: 12px;
          border-radius: 8px;
          display: inline-block;
          margin-bottom: 10px;
             
         }

         h1{

         font-size: 22px;
         color: #1a2a3a;
         margin: 10px 0 5px 0;

         }

         .subtitulo {

         font-size: 14px;
         color: #888;
         margin-bottom: 25px;
         }

         label {

         display: block;
         text-align: left;
         font-size: 14px;
         color: #333;
         margin-top: 12px;
         margin-bottom: 4px;
         }

         input[type="text"],input[type="password"] {

         width: 100%;
         padding: 10px;
         border: 1px solid #ccc;
         border-radius: 6px;
         font-size: 14px;

         }

         button {

         width: 100%;
         background-color: #1a2a3a;
         color: white;
         border: none;
         padding: 12px;
         font-size: 16px;
         font-weight: bold;
         border-radius: 6px;
         margin-top: 20px;
         cursor: pointer;
         }

         button:hover {

         background-color: #2a3a4a;
         }

         .footer {

         margin-top: 25px;
         font-size: 12px;
         color: #aaa;
         }

        </style>


    </head>
    <body>
        <div class="login-box">

         <div class="logo">Logo</div>   

         <h1>CarWash Pro</h1>

         <p class= "subtitulo">Sistema de gestion del lavadero</p>

         <label>Usuario</label>

         <input type="text" placeholder="Ingresa tu Usuario">

         <label>Contraseña</label>

         <input type="password" placeholder="*********">

         <button>Iniciar sesion</button>

         <div class="footer"> CarWash Pro © 2026 </div>

        </div>
    </body>
</html>
